<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

// 老師：這裡已經幫你填好 Firebase 設定，不需要再更動。

  appId: "1:413309446523:web:6b67bd3688eeaf79cb75de"
};
const fbApp = initializeApp(firebaseConfig);

// ---- 國字轉注音（用 pinyin-pro 取得拼音，再對照轉成注音符號） ----
const ZY_INITIALS_2 = ['zh','ch','sh'];
const ZY_INITIALS_1 = ['b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s'];
const ZY_INITIAL_MAP = {
  'b':'ㄅ','p':'ㄆ','m':'ㄇ','f':'ㄈ','d':'ㄉ','t':'ㄊ','n':'ㄋ','l':'ㄌ',
  'g':'ㄍ','k':'ㄎ','h':'ㄏ','j':'ㄐ','q':'ㄑ','x':'ㄒ',
  'zh':'ㄓ','ch':'ㄔ','sh':'ㄕ','r':'ㄖ','z':'ㄗ','c':'ㄘ','s':'ㄙ'
};
const ZY_FINAL_MAP = {
  'i':'ㄧ','u':'ㄨ','ü':'ㄩ',
  'a':'ㄚ','o':'ㄛ','e':'ㄜ','ê':'ㄝ',
  'ai':'ㄞ','ei':'ㄟ','ao':'ㄠ','ou':'ㄡ',
  'an':'ㄢ','en':'ㄣ','ang':'ㄤ','eng':'ㄥ','er':'ㄦ',
  'ia':'ㄧㄚ','ie':'ㄧㄝ','iao':'ㄧㄠ','iu':'ㄧㄡ','iou':'ㄧㄡ',
  'ian':'ㄧㄢ','in':'ㄧㄣ','iang':'ㄧㄤ','ing':'ㄧㄥ','iong':'ㄩㄥ',
  'ua':'ㄨㄚ','uo':'ㄨㄛ','uai':'ㄨㄞ','ui':'ㄨㄟ','uei':'ㄨㄟ',
  'uan':'ㄨㄢ','un':'ㄨㄣ','uen':'ㄨㄣ','uang':'ㄨㄤ','ueng':'ㄨㄥ','ong':'ㄨㄥ',
  'üe':'ㄩㄝ','üan':'ㄩㄢ','ün':'ㄩㄣ'
};
const ZY_ZERO_INITIAL_MAP = {
  'yi':'i','ya':'ia','ye':'ie','yao':'iao','you':'iu','iou':'iou',
  'yan':'ian','yin':'in','yang':'iang','ying':'ing','yong':'iong',
  'yu':'ü','yue':'üe','yuan':'üan','yun':'ün',
  'wu':'u','wa':'ua','wo':'uo','wai':'uai','wei':'uei',
  'wan':'uan','wen':'uen','wang':'uang','weng':'ueng'
};
const ZY_RETROFLEX = ['zh','ch','sh','r','z','c','s'];
const ZY_TONE_MARK = {'1':'', '2':'ˊ', '3':'ˇ', '4':'ˋ'};

function zySyllableToZhuyin(syl){
  const m = syl.match(/^([a-züê]+)([0-5])$/i);
  if(!m) return null;
  let base = m[1].toLowerCase();
  const tone = m[2];

  let initial = '';
  for(const two of ZY_INITIALS_2){
    if(base.startsWith(two)){ initial = two; base = base.slice(2); break; }
  }
  if(!initial){
    for(const one of ZY_INITIALS_1){
      if(base.startsWith(one)){ initial = one; base = base.slice(1); break; }
    }
  }

  let final = base;
  if(!initial && ZY_ZERO_INITIAL_MAP[final] !== undefined){
    final = ZY_ZERO_INITIAL_MAP[final];
  }
  if((initial==='j'||initial==='q'||initial==='x') && final.startsWith('u') && !final.startsWith('ü')){
    final = 'ü' + final.slice(1);
  }

  let finalSym;
  if(ZY_RETROFLEX.includes(initial) && final === 'i'){
    finalSym = '';
  }else{
    finalSym = ZY_FINAL_MAP[final];
    if(finalSym === undefined){ return null; }
  }

  const initSym = initial ? ZY_INITIAL_MAP[initial] : '';
  let result = initSym + finalSym;
  if(tone === '0'){
    result = '˙' + result;
  }else{
    result += (ZY_TONE_MARK[tone] || '');
  }
  return result;
}

function isCJKChar(ch){
  return /[\u4e00-\u9fff\u3400-\u4dbf]/.test(ch);
}

function charToZhuyinGuess(ch){
  try{
    if(!window.pinyinPro || !window.pinyinPro.pinyin) return '';
    const py = window.pinyinPro.pinyin(ch, {toneType:'num', type:'array'});
    if(!py || !py[0]) return '';
    return zySyllableToZhuyin(py[0]) || '';
  }catch(err){
    return '';
  }
}


const MIN_ROWS = 7;
let isEditor = false;
let entries = [];
let className = "三年甲班";
let zhuyinDict = {};
let draftZhuyin = {};
let editingId = null;
let formOpen = false;
let draftColumns = [];
let draftDate = "";
let draftNote = "";
let currentIndex = 0;
let dataReady = false;

const weekdayZh = ["日","一","二","三","四","五","六"];

function normalizeEntry(e){
  if(!e || !e.date) return null;
  let columns = Array.isArray(e.columns) ? e.columns : null;
  if(!columns){
    columns = [];
    if(Array.isArray(e.homework) && e.homework.length) columns.push(e.homework);
    if(Array.isArray(e.items) && e.items.length) columns.push(e.items);
  }
  columns = columns.map(c=> Array.isArray(c) ? c.filter(x=>typeof x==="string" && x.trim().length>0) : []).filter(c=>c.length>0);
  return {
    id: e.id || (Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
    date: e.date,
    columns: columns.length ? columns : [[]],
    note: typeof e.note === "string" ? e.note : ""
  };
}

function rocParts(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return { roc: d.getFullYear()-1911, m: d.getMonth()+1, day: d.getDate(), wd: weekdayZh[d.getDay()] };
}

async function loadAll(){
  try{
    const snap = await get(dataRef);
    if(snap.exists()){
      const parsed = snap.val();
      const raw = Array.isArray(parsed.entries) ? parsed.entries : [];
      entries = raw.map(normalizeEntry).filter(Boolean);
      if(parsed.className) className = parsed.className;
      if(parsed.zhuyinDict && typeof parsed.zhuyinDict === "object") zhuyinDict = parsed.zhuyinDict;
    }
  }catch(err){
    entries = [];
  }
  dataReady = true;
  render();
}

async function persist(){
  try{
    await set(dataRef, { entries, className, zhuyinDict });
  }catch(err){
    alert("儲存失敗，請確認你已經登入，或檢查網路連線後再試一次");
  }
}

async function saveEntries(){ await persist(); }

async function saveClassName(name){
  className = name;
  await persist();
  render();
}

onAuthStateChanged(auth, (user)=>{
  isEditor = !!user;
  if(!isEditor){ formOpen = false; editingId = null; }
  render();
});

function renderToolbar(){
  const bar = document.getElementById("toolbar");
  if(isEditor){
    bar.innerHTML = `
      <span class="role-badge editor">🔓 老師編輯模式</span>
      <button class="btn ghost" id="logoutBtn">登出</button>
    `;
    document.getElementById("logoutBtn").onclick = ()=> signOut(auth);
  }else{
    bar.innerHTML = `
      <span class="role-badge">👀 檢視模式</span>
      <div class="pin-box">
        <input type="email" id="emailInput" placeholder="老師信箱" style="width:150px;">
        <input type="password" id="pwInput" placeholder="密碼" style="width:90px;">
        <button class="btn" id="loginBtn">登入</button>
      </div>
    `;
    document.getElementById("loginBtn").onclick = tryLogin;
    document.getElementById("pwInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") tryLogin(); });
  }
}

function tryLogin(){
  const email = document.getElementById("emailInput").value.trim();
  const pw = document.getElementById("pwInput").value;
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = "登入中…";
  signInWithEmailAndPassword(auth, email, pw)
    .catch(()=>{
      const bar = document.getElementById("toolbar");
      if(!bar.querySelector(".pin-msg")){
        const msg = document.createElement("div");
        msg.className = "pin-msg";
        msg.textContent = "登入失敗，請確認信箱密碼是否正確";
        bar.appendChild(msg);
      }
      btn.disabled = false;
      btn.textContent = "登入";
    });
}


function renderClassName(){
  const box = document.getElementById("headerTitle");
  if(isEditor){
    box.innerHTML = `<input id="classInput" value="${className.replace(/"/g,'&quot;')}" placeholder="輸入班級名稱">電子聯絡本`;
    document.getElementById("classInput").addEventListener("change", (e)=> saveClassName(e.target.value || "三年甲班"));
  }else{
    box.textContent = `${className}電子聯絡本`;
  }
}

function renderAddArea(){
  const area = document.getElementById("addArea");
  if(!isEditor || formOpen){ area.innerHTML=""; return; }
  area.innerHTML = `<div class="add-card" id="openFormBtn">➕ 新增今天的紀錄</div>`;
  document.getElementById("openFormBtn").onclick = ()=> openForm(null);
}

function openForm(entry){
  editingId = entry ? entry.id : null;
  formOpen = true;
  draftDate = entry ? entry.date : new Date().toISOString().slice(0,10);
  draftColumns = entry && Array.isArray(entry.columns) && entry.columns.length ? entry.columns.map(c=>[...c]) : [[],[],[]];
  draftNote = entry ? (entry.note || "") : "";
  draftZhuyin = {};
  renderForm();
  renderAddArea();
}

function renderForm(){
  const area = document.getElementById("formArea");
  area.innerHTML = `
    <div class="form-panel">
      <h3>${editingId ? "✏️ 編輯這一天的聯絡事項" : "📝 新增聯絡事項"}</h3>
      <div class="field">
        <label>日期</label>
        <input type="date" id="fDate" value="${draftDate}">
      </div>
      <div class="field">
        <label>逐格內容（每一欄是抄寫本上的一直行，每一行文字會變成一格）</label>
        <p class="hint">學生會照著這些欄位、一格一格抄到自己的聯絡簿上，欄位順序就是抄寫順序。</p>
        <div class="cols-editor" id="colsEditor"></div>
        <button type="button" class="zhuyin-btn" id="autoZhuyinBtn">🔤 自動轉注音（產生後可修正）</button>
        <div id="zhuyinReview"></div>
      </div>
      <div class="field">
        <label>老師補充說明（選填，不算在抄寫格內）</label>
        <textarea id="fNote" style="min-height:44px;" placeholder="給家長的提醒">${escapeHtml(draftNote)}</textarea>
      </div>
      <div class="form-actions">
        <button class="btn ghost" id="cancelFormBtn">取消</button>
        <button class="btn primary" id="saveFormBtn">${editingId ? "儲存修改" : "新增紀錄"}</button>
      </div>
    </div>
  `;
  renderColsEditor();
  document.getElementById("fDate").addEventListener("change", e=> draftDate = e.target.value);
  document.getElementById("fNote").addEventListener("input", e=> draftNote = e.target.value);
  document.getElementById("cancelFormBtn").onclick = closeForm;
  document.getElementById("saveFormBtn").onclick = submitForm;
  document.getElementById("autoZhuyinBtn").onclick = runAutoZhuyin;
}

function renderColsEditor(){
  const wrap = document.getElementById("colsEditor");
  wrap.innerHTML = draftColumns.map((col, i)=>`
    <div class="col-edit">
      <div class="col-edit-head">
        <span>第 ${i+1} 欄</span>
        ${draftColumns.length>1 ? `<button class="btn small ghost" data-remove-col="${i}">刪除</button>` : ``}
      </div>
      <textarea data-col="${i}" placeholder="每行一格，例如：\n數習\n20\n21">${escapeHtml(col.join("\n"))}</textarea>
    </div>
  `).join("") + `<button class="add-col-btn" id="addColBtn">＋ 新增一欄</button>`;

  wrap.querySelectorAll("textarea[data-col]").forEach(ta=>{
    ta.addEventListener("input", e=>{
      const idx = parseInt(e.target.dataset.col, 10);
      draftColumns[idx] = e.target.value.split("\n").map(s=>s.trim()).filter(Boolean);
    });
  });
  wrap.querySelectorAll("[data-remove-col]").forEach(btn=>{
    btn.onclick = ()=>{
      draftColumns.splice(parseInt(btn.dataset.removeCol,10), 1);
      renderColsEditor();
    };
  });
  document.getElementById("addColBtn").onclick = ()=>{
    draftColumns.push([]);
    renderColsEditor();
  };
}

function runAutoZhuyin(){
  const chars = new Set();
  draftColumns.forEach(col=>{
    (col||[]).forEach(line=>{
      if(typeof line !== "string") return;
      tokenizeLine(line).forEach(tok=>{
        if(tok.length===1 && isCJKChar(tok)) chars.add(tok);
      });
    });
  });
  if(chars.size===0){
    document.getElementById("zhuyinReview").innerHTML = `<p class="hint" style="margin-top:10px;">目前欄位裡沒有偵測到中文字，不需要標注音唷。</p>`;
    return;
  }
  chars.forEach(ch=>{
    if(draftZhuyin[ch] === undefined){
      draftZhuyin[ch] = (zhuyinDict && zhuyinDict[ch]) ? zhuyinDict[ch] : charToZhuyinGuess(ch);
    }
  });
  renderZhuyinReview(Array.from(chars));
}

function renderZhuyinReview(chars){
  const box = document.getElementById("zhuyinReview");
  box.innerHTML = `
    <div class="zhuyin-review">
      <p class="zy-hint">已自動產生注音，多音字可能會猜錯，請檢查一下每個字的讀音，錯的話直接改掉再按「套用」：</p>
      <div class="zy-grid">
        ${chars.map(ch=>`
          <div class="zy-item">
            <span class="zy-char">${escapeHtml(ch)}</span>
            <input data-zy-char="${escapeHtml(ch)}" value="${escapeHtml(draftZhuyin[ch]||'')}">
          </div>
        `).join("")}
      </div>
      <div class="form-actions" style="margin-top:10px;">
        <button type="button" class="btn primary small" id="applyZhuyinBtn">✅ 套用這些注音</button>
      </div>
    </div>
  `;
  box.querySelectorAll("[data-zy-char]").forEach(input=>{
    input.addEventListener("input", e=>{
      draftZhuyin[e.target.dataset.zyChar] = e.target.value.trim();
    });
  });
  document.getElementById("applyZhuyinBtn").onclick = ()=>{
    box.innerHTML = `<p class="hint" style="margin-top:10px;color:var(--green-deep);">✅ 注音已套用，記得存檔才會真的儲存。</p>`;
  };
}

function closeForm(){
  formOpen = false; editingId = null;
  document.getElementById("formArea").innerHTML = "";
  renderAddArea();
}

async function submitForm(){
  if(!draftDate){ alert("請選擇日期唷"); return; }
  const cleanCols = draftColumns.map(c=>c.filter(x=>x.trim().length>0)).filter(c=>c.length>0);
  if(cleanCols.length===0){ alert("請至少填寫一欄內容"); return; }

  zhuyinDict = { ...zhuyinDict, ...draftZhuyin };

  if(editingId){
    const idx = entries.findIndex(e=>e.id===editingId);
    if(idx>-1) entries[idx] = {...entries[idx], date:draftDate, columns:cleanCols, note:draftNote.trim()};
  }else{
    entries.push({
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      date: draftDate, columns: cleanCols, note: draftNote.trim()
    });
  }
  await saveEntries();
  currentIndex = 0;
  closeForm();
  render();
}

async function deleteEntry(id){
  if(!confirm("確定要刪除這則紀錄嗎？")) return;
  entries = entries.filter(e=>e.id!==id);
  await saveEntries();
  render();
}

function renderList(){
  const list = document.getElementById("list");
  const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date));

  if(sorted.length===0){
    list.innerHTML = `
      <div class="empty">
        <div class="big">🌻</div>
        <p>還沒有聯絡簿紀錄唷</p>
        <p>${isEditor ? "點選上方「新增今天的紀錄」開始寫吧！" : "請等老師更新今天的內容"}</p>
      </div>`;
    return;
  }

  if(currentIndex > sorted.length-1) currentIndex = sorted.length-1;
  if(currentIndex < 0) currentIndex = 0;
  const e = sorted[currentIndex];
  const p = rocParts(e.date);

  const navHtml = `
    <div class="day-nav">
      <button class="nav-btn" id="prevDayBtn" ${currentIndex>=sorted.length-1 ? "disabled" : ""}>◀ 前一天</button>
      <div class="day-indicator">民國${p.roc}年${p.m}月${p.day}日　星期${p.wd}　(第 ${currentIndex+1} / ${sorted.length} 筆)</div>
      <button class="nav-btn" id="nextDayBtn" ${currentIndex<=0 ? "disabled" : ""}>後一天 ▶</button>
    </div>
  `;

  const rawCols = Array.isArray(e.columns) && e.columns.length ? e.columns : [[]];
  const physicalCols = buildPhysicalColumns(rawCols, MIN_ROWS);
  const colsHtml = physicalCols.map(pc=>{
    let cells = "";
    for(let r=0;r<MIN_ROWS;r++){
      const cell = pc.cells[r];
      if(cell && cell.text){
        const zyHtml = cell.zhuyin ? `<span class="cell-zhuyin">${renderZhuyinHtml(cell.zhuyin)}</span>` : "";
        cells += `<div class="grid-cell"><span class="cell-char">${escapeHtml(cell.text)}</span>${zyHtml}</div>`;
      }else{
        cells += `<div class="grid-cell"></div>`;
      }
    }
    const numHtml = pc.number ? pc.number : "";
    return `<div class="grid-col"><div class="num">${numHtml}</div>${cells}</div>`;
  }).join("");

  const cardHtml = `
    <div class="entry">
      <div class="entry-header">
        <h2>今天的功課和明天應帶物品</h2>
        ${isEditor ? `
          <div class="entry-actions">
            <button class="icon-btn" title="編輯" data-edit="${e.id}">✏️</button>
            <button class="icon-btn" title="刪除" data-del="${e.id}">🗑️</button>
          </div>` : ``}
      </div>
      <div class="entry-body">
        <div class="grid-scroll">
          <div class="grid-cols" style="height:${52 + MIN_ROWS*76}px;">${colsHtml}</div>
        </div>
        <div class="date-side">
          <div class="drow"><div class="dval">${p.roc}</div><div class="dlab">年</div></div>
          <div class="drow"><div class="dval">${p.m}</div><div class="dlab">月</div></div>
          <div class="drow"><div class="dval">${p.day}</div><div class="dlab">日</div></div>
          <div class="drow weekday"><div class="dval"><span class="wlabel">星期</span><span class="wday">${p.wd}</span></div></div>
        </div>
      </div>
      ${e.note ? `<div class="note-box"><b>老師補充：</b>${escapeHtml(e.note)}</div>` : ``}
    </div>
  `;

  list.innerHTML = navHtml + cardHtml;

  const prevBtn = document.getElementById("prevDayBtn");
  const nextBtn = document.getElementById("nextDayBtn");
  if(prevBtn) prevBtn.onclick = ()=>{ currentIndex++; render(); };
  if(nextBtn) nextBtn.onclick = ()=>{ currentIndex--; render(); };

  list.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.onclick = ()=>{ openForm(entries.find(x=>x.id===btn.dataset.edit)); window.scrollTo({top:0, behavior:"smooth"}); };
  });
  list.querySelectorAll("[data-del]").forEach(btn=>{
    btn.onclick = ()=> deleteEntry(btn.dataset.del);
  });
}

function tokenizeLine(line){
  // 英文字母＋數字（像 P10、20）視為一個整體，留在同一格；
  // 其他字元（中文、標點等）逐字各自一格
  const tokens = [];
  const re = /[A-Za-z0-9]+|./gs;
  let m;
  while((m = re.exec(line)) !== null){
    tokens.push(m[0]);
  }
  return tokens;
}

function expandCells(col){
  const out = [];
  (col || []).forEach(line=>{
    if(typeof line !== "string" || line.length===0){ return; }
    tokenizeLine(line).forEach(tok=>{
      let zy = "";
      if(tok.length===1 && isCJKChar(tok)){
        zy = (zhuyinDict && zhuyinDict[tok]) ? zhuyinDict[tok] : charToZhuyinGuess(tok);
      }
      out.push({ text: tok, zhuyin: zy });
    });
  });
  return out;
}

function buildPhysicalColumns(columns, capacity){
  const physical = [];
  columns.forEach((col, idx)=>{
    const cells = expandCells(col);
    if(cells.length === 0){
      physical.push({ number: idx+1, cells: [] });
      return;
    }
    let first = true;
    for(let i=0; i<cells.length; i+=capacity){
      physical.push({ number: first ? (idx+1) : null, cells: cells.slice(i, i+capacity) });
      first = false;
    }
  });
  return physical;
}

function renderZhuyinHtml(zy){
  if(!zy) return "";
  if(zy.startsWith("˙")){
    const base = zy.slice(1);
    return `<span class="zy-tone neutral">˙</span>${escapeHtml(base)}`;
  }
  const last = zy.slice(-1);
  if(last==="ˊ" || last==="ˇ" || last==="ˋ"){
    const base = zy.slice(0, -1);
    const chars = Array.from(base);
    const lastChar = chars.pop();
    const headHtml = chars.map(c=>escapeHtml(c)).join("");
    return `${headHtml}<span class="zy-last-wrap">${escapeHtml(lastChar)}<span class="zy-tone right">${last}</span></span>`;
  }
  return escapeHtml(zy);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function render(){
  renderToolbar();
  renderClassName();
  renderAddArea();
  renderList();
}

loadAll();
</script>
